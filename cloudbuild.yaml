steps:
  # ==========================================
  # 1. API BUILD & DEPLOY
  # ==========================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-api'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/ekenesports-api:$COMMIT_SHA', '-f', 'apps/api/Dockerfile', '.']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-api'
    args: ['push', 'gcr.io/$PROJECT_ID/ekenesports-api:$COMMIT_SHA']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-api'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'ekenesports-api'
      - '--image'
      - 'gcr.io/$PROJECT_ID/ekenesports-api:$COMMIT_SHA'
      - '--region'
      - 'europe-west3'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'

  # ==========================================
  # 2. ADMIN BUILD & DEPLOY
  # ==========================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-admin'
    args: 
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/ekenesports-admin:$COMMIT_SHA'
      - '--build-arg'
      - 'NEXT_PUBLIC_API_URL=$_NEXT_PUBLIC_API_URL'
      - '--build-arg'
      - 'NEXT_PUBLIC_BACKEND_API_URL=$_NEXT_PUBLIC_BACKEND_API_URL'
      - '--build-arg'
      - 'NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=$_NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY'
      - '-f'
      - 'apps/admin/Dockerfile'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-admin'
    args: ['push', 'gcr.io/$PROJECT_ID/ekenesports-admin:$COMMIT_SHA']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-admin'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'ekenesports-admin'
      - '--image'
      - 'gcr.io/$PROJECT_ID/ekenesports-admin:$COMMIT_SHA'
      - '--region'
      - 'europe-west3'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'

  # ==========================================
  # 3. WEB (STOREFRONT) BUILD & DEPLOY
  # ==========================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-web'
    args: 
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/ekenesports-web:$COMMIT_SHA'
      - '--build-arg'
      - 'NEXT_PUBLIC_API_URL=$_NEXT_PUBLIC_API_URL'
      - '--build-arg'
      - 'NEXT_PUBLIC_BACKEND_API_URL=$_NEXT_PUBLIC_BACKEND_API_URL'
      - '--build-arg'
      - 'NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=$_NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY'
      - '-f'
      - 'apps/web/Dockerfile'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-web'
    args: ['push', 'gcr.io/$PROJECT_ID/ekenesports-web:$COMMIT_SHA']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-web'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'ekenesports-web'
      - '--image'
      - 'gcr.io/$PROJECT_ID/ekenesports-web:$COMMIT_SHA'
      - '--region'
      - 'europe-west3'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'

images:
  - 'gcr.io/$PROJECT_ID/ekenesports-api:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/ekenesports-admin:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/ekenesports-web:$COMMIT_SHA'

# Defining optional variable fallbacks for substitution
substitutions:
  _NEXT_PUBLIC_API_URL: 'https://api.ekenesports.com'
  _NEXT_PUBLIC_BACKEND_API_URL: 'https://api.ekenesports.com'
  _NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: 'pk_test_placeholder'

options:
  logging: CLOUD_LOGGING_ONLY
